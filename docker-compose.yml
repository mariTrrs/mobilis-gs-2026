services:
  mysql-inventario:
    image: mysql:8.4
    container_name: mobilis-mysql-inventario
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_inventario
      MYSQL_USER: mobilis
      MYSQL_PASSWORD: mobilis
    ports:
      - "3306:3306"
    volumes:
      - mysql_inventario_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-comodato:
    image: mysql:8.4
    container_name: mobilis-mysql-comodato
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_comodato
      MYSQL_USER: mobilis
      MYSQL_PASSWORD: mobilis
    ports:
      - "3307:3306"
    volumes:
      - mysql_comodato_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_inventario_data:
  mysql_comodato_data:
