server.port=0
spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]}
eureka.instance.prefer-ip-address=true

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db_comodato;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-local.sql

spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.httpclient.hc5.enabled=true

server.error.include-message=always
server.error.include-stacktrace=never
